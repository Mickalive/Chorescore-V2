name: ChoreScore V2 Factory Continuation

on:
  workflow_run:
    workflows: ["ChoreScore V2 Greenfield Factory"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: chorescore-v2-continuation
  cancel-in-progress: true

jobs:
  continue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: lab/chorescore-v2
          fetch-depth: 1
          persist-credentials: false
      - id: state
        run: |
          final=$(jq -r 'all(.criteria[];.status=="complete") and .pendingArtifact==null and (.activeCriteria|length)==0' docs/RELEASE_STATUS.json)
          echo "final=$final" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.state.outputs.final != 'true' }}
        run: sleep 300
      - if: ${{ steps.state.outputs.final != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow chorescore-v2-factory.yml --limit 20 --json databaseId,status | jq --argjson source "$SOURCE_RUN" '[.[] | select(.databaseId != $source and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')
          if [[ "$active" != "0" ]]; then
            echo "Another factory run is already active; continuation not needed."
            exit 0
          fi
          gh workflow run chorescore-v2-factory.yml --repo "$GITHUB_REPOSITORY"
          echo "Dispatched next ChoreScore V2 factory cycle."
